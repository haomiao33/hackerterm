<!doctype html>
<html>
<head>
<style>
  /*
   * 终端独占整个窗口。原先这里还有一块固定高度 160px 的 #log 诊断日志区，
   * 前提是"真机上用户没有 DevTools"；用户能开 DevTools 之后那块区域就只是
   * 白占屏幕，日志已经改成只写 console（见 diagnostics/log.ts）。
   *
   * html/body 上的 overflow: hidden 保证页面本身不出现滚动条——历史上出过的
   * bug 是子元素高度叠加超出视口，页面级滚动条把终端下半截切掉。
   */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  #terminal {
    /*
     * min-height: 0 在去掉日志区之后**仍然必须留着**，它防的不是"跟日志区抢
     * 高度"，而是 flex 子项默认的 min-height: auto——那个默认值会让子项被自己
     * 的内容（xterm 的 viewport）撑破容器而不是被压缩。缩小窗口时 FitAddon
     * 重新量尺寸有一个时间差，这期间 xterm 的行数仍是旧的、内容比容器高，
     * 没有这一行就会重新出现页面级滚动条。这是标准 flexbox 行为，跟同级还有
     * 没有别的子项无关，所以不能顺手删掉。
     */
    flex: 1 1 auto;
    min-height: 0;
  }
</style>
</head>
<body><div id="terminal"></div><script type="module" src="./boot.ts"></script></body>
</html>
