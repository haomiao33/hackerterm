syntax = "proto3";
package hackerterm.v1;

message Envelope {
  oneof kind {
    Request  request  = 1;
    Response response = 2;
    Event    event    = 3;
  }
}

message Request {
  uint64 id      = 1;
  string method  = 2;
  bytes  payload = 3;
}

message Response {
  uint64 id = 1;
  oneof result {
    bytes payload = 2;
    Error error   = 3;
  }
}

message Event {
  string topic   = 1;
  bytes  payload = 2;
}

enum ErrorCode {
  ERROR_CODE_UNKNOWN          = 0;
  ERROR_CODE_UNKNOWN_METHOD   = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND        = 3;
  ERROR_CODE_CONNECT_FAILED   = 6;
  ERROR_CODE_TIMEOUT          = 8;
  ERROR_CODE_CANCELLED        = 9;
  ERROR_CODE_INTERNAL         = 11;
}

message Error {
  ErrorCode code = 1;
  string    key  = 2;
  map<string, string> params = 3;
  string    detail    = 4;
  bool      retryable = 5;
}

message Hello {
  uint32 protocol_major      = 1;
  uint32 protocol_minor      = 2;
  uint32 min_supported_major = 3;
  string impl_version        = 4;
  repeated string capabilities = 5;
}

// ---- session ----

message SessionOpenRequest {
  string shell = 1;   // 空则用系统默认
  uint32 cols  = 2;
  uint32 rows  = 3;
  string cwd   = 4;
}
message SessionOpenResponse { string session_id = 1; }

message SessionResizeRequest { string session_id = 1; uint32 cols = 2; uint32 rows = 3; }
message SessionCloseRequest  { string session_id = 1; }
message SessionAckRequest    { string session_id = 1; uint64 bytes_consumed = 2; }

enum Signal {
  SIGNAL_NONE = 0;
  SIGNAL_INT  = 1;
  SIGNAL_TERM = 2;
  SIGNAL_KILL = 3;
}
message SessionSignalRequest { string session_id = 1; Signal signal = 2; }

message Empty {}

enum SessionState {
  SESSION_STATE_UNKNOWN   = 0;
  SESSION_STATE_CONNECTED = 1;
  SESSION_STATE_CLOSED    = 2;
  SESSION_STATE_FAILED    = 3;
}
message SessionStateEvent { string session_id = 1; SessionState state = 2; Error error = 3; }
message SessionExitEvent  { string session_id = 1; int32 exit_code = 2; }

// 流控停摆自愈事件（topic: session.flow_stalled）。
//
// 读线程因高水位暂停后，整整一个看门狗周期内未确认字节数一个字节都没降，判定
// ack 通路已断，于是强制清零未确认窗口继续读（VS Code 的
// TerminalProcess.clearUnacknowledgedChars() 等价物）。清零等于放弃背压，是
// 降级不是修复，所以必须报出来——静默自愈会让真实的 ack 链路故障永远查不出来。
//
// 为什么不复用 SessionStateEvent：那个消息的语义是"会话状态机变到了哪一档"
// （Connected/Closed/Failed），而这里会话既没关也没失败，只是流控记账被放弃了；
// 塞进 Failed 会让渲染层以为会话已经死了。
message SessionFlowStalledEvent {
  string session_id           = 1;
  uint64 unacknowledged_bytes = 2;  // 被强制丢弃的未确认字节数
  uint64 stalled_ms           = 3;  // 判定停摆用的等待时长
}

// ---- 诊断 ----

// core.stats：进程级诊断快照。
//
// 存在的理由是"读线程死没死"在真机上完全不可见。读线程停止的正常路径已经会经
// session.state 报出来，但**panic 会直接跳过那条上报**，而"数据永远不再来"正是
// 本项目反复出现的症状。所以需要一个不依赖任何事件、随时可查的计数——事件只能
// 证明发生过什么，证明不了此刻还剩几个线程活着。
message CoreStatsRequest  {}
message CoreStatsResponse { uint32 live_read_threads = 1; }
