<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  视觉回归专用的 fontconfig，通过 FONTCONFIG_FILE 环境变量交给 Electron
  （见 e2e/visual.e2e.ts）。**只有截图比对用它**，其余端到端测试照常用系统配置。

  **而且只有 Linux 用它**：Windows 上 Chromium 走 DirectWrite，压根不读 fontconfig，
  设了 FONTCONFIG_FILE 也是空转。Windows 侧靠的是另一件事——mount.ts 里
  `fontFamily: 'Menlo, Consolas, monospace'` 的第二档 Consolas 是**系统组件**
  （自 Vista 起随 Windows 分发），本身就没有"解析到哪个字体"的不确定性。
  两个平台各有各的基线（文件名带 .linux / .win32 后缀），互不比较。

  为什么必须钉死字体：截图比对的判据是像素。终端里 99% 的像素都是字形，字形一变
  整张图就变，基线立刻失效。而 src/ui/browser/terminal/mount.ts 里的 fontFamily 是
  'Menlo, Consolas, monospace' —— 前两个是 macOS/Windows 字体，Linux 上必然落到
  第三档 `monospace`，而 `monospace` 具体解析成哪个字体**完全由这台机器装了什么
  字体决定**：本地容器里只有 DejaVu，GitHub 的 ubuntu runner 镜像装了几十种，
  两边解析结果不同，基线就永远对不上，视觉回归会变成一个天天误报、最后被所有人
  关掉的测试。

  这个文件用三招把变量全部消掉：
  1. `<dir>` 只声明 DejaVu 一个目录 —— 系统里还装了什么都与本次渲染无关。
  2. 把 monospace/sans-serif/serif 三个通用族全部 assign 到 DejaVu Sans Mono ——
     不管 CSS 里写了什么，落到的都是同一个字体文件。
  3. 显式钉死抗锯齿/hinting/亚像素排列 —— 这几项在不同发行版的 fontconfig 默认值
     不一样（比如 hintstyle 有 hintslight/hintfull 之分），而它们直接改变字形的
     像素输出。rgba=none 关掉亚像素渲染，避免彩色边缘让像素差异凭空放大。

  仍然依赖的外部前提只剩一个：/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  存在（Debian/Ubuntu 的 fonts-dejavu-core 包）。测试会先检查这个文件，缺了就
  跳过并说明原因，而不是拿一个错字体去比对然后红一片。CI 侧由 smoke job 的
  apt 步骤显式安装该包。
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
