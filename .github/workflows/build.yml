name: Build & Verify (Windows)

# 触发条件：推送到任意分支 + 手动触发，方便随时在 Actions 页面点一次。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # build：产出 Windows x64 可执行文件并上传为 artifact。
  # 这个 job 必须绿——它是用户下载 exe 的唯一来源。
  # ────────────────────────────────────────────────────────────────
  build:
    name: build (windows-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不要在这里写 version —— package.json 已有 "packageManager": "pnpm@9.12.0"，
      # 两处同时指定会让 pnpm/action-setup 直接报 ERR_PNPM_BAD_PM_VERSION 拒绝启动。
      # 让它从 packageManager 读，版本只有一个事实来源。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      # prost-build 0.13（crates/ht-proto/build.rs 每次构建都调）不自带 protoc，
      # Windows runner 上必须显式安装，否则 cargo build 在 build.rs 这一步就会失败。
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 网络偶发抖动重试，最多 3 次。
      - name: Install dependencies (pnpm install, retry x3)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          echo "pnpm install failed after 3 attempts"
          exit 1

      # 产出平台专有的 ht-node.win32-x64-msvc.node（crates/ht-node/index.js
      # 这个 dispatcher 已入库，构建产物不入库，靠这一步在 CI 里现产）。
      - name: Build native module (napi-rs)
        run: pnpm build:native

      # 产出 out/main、out/core-host、out/preload、out/ui/browser。
      - name: Build Electron app
        run: pnpm build

      # electron-builder：见 package.json 的 "build" 字段。
      # asarUnpack 保证 ht-node 的 .node 原生模块不会被塞进 asar 里导致加载失败。
      - name: Package Windows exe
        run: pnpm package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackerterm-windows-x64
          # electron-builder 的 win target 从 portable 换成了 zip（见 package.json
          # 的 build.win.target）：portable 每次启动都要把整个应用解压到 %TEMP%，
          # 叠加 Windows Defender 对新解压文件的实时扫描，是 exe 启动要 20-30 秒的
          # 根因。zip 产出解压即用的目录，用户只解压一次，之后直接跑里面的 exe，
          # 省掉每次启动的解压步骤。产物文件名/glob 同步从 *.exe 换成 *.zip
          # （命名规则仍由 build.win.artifactName 决定，只是 ${ext} 从 exe 变 zip）。
          path: release/*.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # smoke：「键盘 → PTY → 屏幕」最短链路的 headless 端到端冒烟。
  #
  # 为什么单开一个 job，而不是塞进下面的 verify：
  # verify 在设计上就是"预期会红"的探针（见它自己的注释：`yes` 命令在
  # Windows 上不存在，红色是有价值的信息而不是故障信号），全部步骤挂了
  # continue-on-error，没人会因为它红去拦一次合并。把冒烟测试放进去，等于
  # 把一个**必须当红绿灯用**的门禁塞进一个大家已经约定好忽略红色的 job，
  # 信号会被淹掉——而这条链路正是连着两天没跑通 demo 的那条，它红了必须有人
  # 立刻知道。所以单开 job，不加 continue-on-error：红就是真的坏了。
  #
  # 不设 needs: build，和 build 并行：build 是用户下载安装包的唯一来源，
  # 冒烟红不该拦住出包（产物路径 release/*.zip 一个字都没动）。
  #
  # 为什么跑在 Linux 上：
  # 1. 历史上那四个真故障里有三个（xterm.css 没引入、数据面 MessagePort
  #    transfer 静默丢消息、亮色主题光标不可见）是渲染层/IPC 层的问题，
  #    与操作系统无关，Linux 上一样能抓——已经用"把那行 postMessage 退回
  #    有 bug 的写法"实测验证过测试会变红。
  # 2. Linux runner 比 Windows runner 快且便宜，冒烟测试要跑得勤。
  # 它的**盲区**由下面新增的 smoke-windows 补上（ConPTY 专有路径 + 在 Linux 上
  # 只能跳过的那条"命令输出"断言）。两个平台各跑一份，不是重复劳动。
  #
  # ── 【这个 job 里跑的东西】────────────────────────────────────────────
  # `pnpm test:e2e` = e2e/**/*.e2e.ts 全部（见 e2e/vitest.config.ts 的 include），
  # 新增文件自动进来，这里不需要、也不应该逐个登记或过滤。
  # 特别点名一条本轮新增的，因为它在 Linux 上**恰恰是判据最干净的那个平台**：
  # e2e/concurrency-crosstalk.e2e.ts —— 真 Electron 里同时开 13 条会话
  # （12 条 + 主终端），验证**发送**和**返回**两个方向都不串。Linux 上 PTY 子进程
  # exec 不起来、没有 shell，每条会话**只会回显自己被写进去的字节**，一个字节的
  # 噪声都没有；"这个标记怎么会出现在这条流里"因此没有第二种解释。Windows 上是
  # 真 PowerShell，同样的判据要在满是提示符/语法高亮/自动上报的噪声里成立——
  # 两边合起来才算数。
  # 【注意它慢】这个文件在本机要跑约 2 分钟，其中 100 秒花在"开 12 条会话"上：
  # Linux 的 Electron 里每条 session.open 要 ~8.3 秒（子进程崩在 Chromium 的 fd
  # 归属检查上，而 Rust 的 Command::spawn 要等子进程 exec 或死掉才返回），而同一段
  # 代码在普通 Node 进程里 12 条一共只要 76ms。这不是测试的开销，是**它发现的一个
  # 真问题**，细节写在那个文件的 OPEN_DEADLINE_MS 注释里。
  # ────────────────────────────────────────────────────────────────
  smoke:
    name: smoke e2e (linux, 键盘 → PTY → 屏幕)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      # 同 build job：prost-build 不自带 protoc。
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Electron 在 headless Linux 上要有 X 服务器（xvfb）和一组 Chromium 运行时
      # 共享库。GitHub 的 ubuntu 镜像大多已自带，这里显式装一遍，免得哪天换了镜像
      # 就以"Missing X server or $DISPLAY"这种和本项目毫无关系的错误红掉。
      #
      # fonts-dejavu-core 是**视觉回归**（e2e/visual.e2e.ts）唯一的外部前提：
      # 基线截图在 DejaVu Sans Mono 下生成，e2e/fixtures/fonts.conf 通过
      # FONTCONFIG_FILE 把字体解析钉死到这一个文件，否则 `monospace` 会随机器
      # 装了什么字体而变，基线永远对不上。装不上的话视觉回归会**跳过**（不是
      # 失败）——那两个真实发生过的渲染故障就重新失去防线，所以这一步必须成功。
      - name: Install Electron runtime deps (xvfb + Chromium shared libs + 视觉回归字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-dejavu-core

      - name: Install dependencies (pnpm install, retry x3)
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          echo "pnpm install failed after 3 attempts"
          exit 1

      # 端到端测试跑的是**真实构建产物**（out/ 下的主进程/utility/渲染包 + 真的
      # .node 原生模块），所以这两步必须在测试之前跑完，缺一不可。
      - name: Build native module (napi-rs)
        run: pnpm build:native

      - name: Build Electron app
        run: pnpm build

      # xvfb-run -a：自动挑一个没被占用的 display 号。
      - name: E2E smoke (Playwright + real Electron + real PTY)
        run: xvfb-run -a pnpm test:e2e

      # 视觉回归红了之后，唯一有用的信息是"哪几个像素不一样"，而那只能看图。
      # if: failure() —— 只在真红的时候传，绿的时候这个目录压根不存在。
      # 路径与 build job 的 release/*.zip 完全无关，不影响用户下载安装包。
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-linux
          path: e2e/__screenshots__/__artifacts__/
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────
  # smoke-windows：同一套端到端冒烟，跑在产品的**正式目标平台**上。
  #
  # ── 【原则：全套测试两个平台都跑，Windows 上跑的不是子集】───────────────
  # 曾经的想法是"一个测试只有在它真的需要 Windows 才放进 Windows job，不需要的
  # 别放，免得制造假红"。**这条已经作废**，因为它被一个真实案例直接证伪了：
  # e2e/latency-pairing.e2e.ts 验证的是"自动回复不产生样本"这条配对逻辑，按那条
  # 原则它是"平台无关、不必进 Windows 门禁"的典型——而**正是因为它照样在
  # Windows 上跑了，才暴露出焦点上报 `ESC[I` 这个配对漏洞**。那条上报只有真
  # PowerShell 在回路里才会发，Linux 上永远不出现（Electron 里 PTY 子进程根本
  # exec 不起来，没有 shell 去开模式 1004）。
  # 结论：本地先做出来快速迭代，但远程跑的是**全套**。vitest 的 include 是
  # `e2e/**/*.e2e.ts`（见 e2e/vitest.config.ts），所以新增的端到端文件会自动进入
  # 这两个 job，不需要在这里逐个登记——**也不要**在这里加过滤把某些文件排除掉。
  #
  # 为什么值得再跑一遍（不是重复上面的 smoke）：
  # 1. e2e/smoke.e2e.ts 里第二条断言「命令真的执行了：屏幕上出现 hello」
  #    在 Linux 上是**跳过**的——portable-pty 在 fork 之后 exec 之前调
  #    close_random_fds()，撞上 Chromium 覆盖过的 close() 的 fd 归属检查，
  #    子进程直接 IMMEDIATE_CRASH，shell 从来没起来。Windows 走 ConPTY，
  #    根本没有 fork/close-fds 这一段，那条断言在这里是**活的**。
  #    也就是说，"shell 真的在 Electron 进程里跑起来了"这件事，只有这个
  #    job 能验证。
  # 2. 顺带覆盖 crates/ht-core/src/session.rs 里 Windows 专有的 ConPTY 分支
  #    和默认 shell（powershell.exe）路径。
  # 3. **并发会话**（e2e/concurrency-core.e2e.ts，产品第②条的「10+ 并发会话」）：
  #    12 条会话同时刷屏时，Windows 上是 12 个 conhost + 12 个 PowerShell，
  #    每个都带 PSReadLine 的重绘和语法高亮，输出块的大小与节奏跟 bash 完全不是
  #    一回事。串扰、读线程计数、内存这三件事的**路由逻辑**平台无关，但把它们
  #    压到真实并发下的**负载形态**是平台相关的，所以两个平台都要跑。
  # 4. **全流程双向串扰**（e2e/concurrency-crosstalk.e2e.ts，本轮新增）：同一个
  #    渲染进程里同时开 13 条会话（12 条诊断会话 + 主终端），验证
  #    「写给 A 的字节只进 A 的 PTY」和「A 的输出只回到 A 的消费者」两个方向。
  #    上面第 3 条走的是普通 Node 直连 napi，**整个渲染侧数据面没被执行**；这一条
  #    补的正是那一段（两跳 MessagePort + SessionDataBuffer + 合批 + 出向路由）。
  #    为什么它在**这个 job** 里格外有价值：判据依赖"写进去的东西会回显回来"，
  #    Windows 上这件事是**真 PowerShell + PSReadLine** 做的，回显里混着提示符、
  #    语法高亮的转义序列、CPR/焦点上报等一堆主动输出——而 Linux 上只有内核行规程
  #    干干净净地回显。同一套判据要在这两种噪声水平下都成立，才算真的立住了。
  #    时间预算：Linux 上约 2 分钟（大头是 12 次 session.open，见 smoke job 的注释）。
  #    Windows 走 ConPTY、没有那个崩溃的子进程，**预期会快得多**——两边的
  #    「并发开 12 条会话 …ms」日志正好互为对照。
  #
  # 【硬门禁，不加 continue-on-error】理由：
  # 这条链路正是连着两天没跑通 demo 的那条，而 Windows 是用户实际会跑的平台。
  # 它红了 = 用户手里的 exe 大概率也是坏的，必须立刻有人知道。verify job 那种
  # "预期会红、大家约定忽略" 的定位对它完全不适用（verify 是可移植性探针，
  # 这个是红绿灯）。同时它不设 needs: build，与 build 并行——build 是用户下载
  # 安装包的唯一来源，产物路径 release/*.zip 一个字都没动，冒烟红不拦出包。
  #
  # 【关于 windows-latest 能不能跑 Electron GUI —— 查到的依据】
  # 这是本 job 最大的未知数，所以查了官方/上游一手材料而不是猜：
  # - Playwright **自己的 CI** 就在 windows-latest 上跑 Electron 测试。见
  #   microsoft/playwright 的 .github/workflows/tests_secondary.yml 里
  #   `test_electron` job：`matrix.os: [ubuntu-latest, macos-latest,
  #   windows-latest]`。配套的 .github/actions/run-test/action.yml 里，只有
  #   `if [[ "$(uname)" == "Linux" ]]` 那一支才套 xvfb-run，Windows 分支是
  #   **直接跑命令、不做任何显示相关的准备**。这是"windows-latest 上
  #   `_electron.launch()` 能用"最硬的一手证据：上游拿它当回归测试在跑。
  # - Playwright 官方 CI 文档（https://playwright.dev/docs/ci）也只对 Linux
  #   提出了 "headed execution requires Xvfb" 的要求，Windows/macOS agent
  #   没有额外配置要求。
  # - 原理上说得通：Playwright 的 Electron 模式通过 CDP 驱动页面，
  #   page.keyboard 走的是 Input.dispatchKeyEvent，**不需要**操作系统层面
  #   的窗口焦点或可见桌面。这也是为什么它不受 Windows Session 0 隔离
  #   （服务进程拿不到交互式桌面）的影响，而 WinAppDriver 那类真·桌面 UI
  #   自动化在 GitHub 托管 runner 上就是不行——两者不是一回事，别拿后者的
  #   失败案例推断前者。
  #
  # 【已知坑，写在这里免得下次重新踩】
  # - 没有 GPU：runner 是无显卡虚拟机，Chromium 走软件渲染，xterm 的 WebGL
  #   addon 很可能起不来。这**不影响**本 job：src/ui/browser/terminal/mount.ts
  #   已经做了 WebGL 失败退回 DOM 渲染器的降级，屏幕缓冲区照样有内容，而所有
  #   断言读的都是缓冲区不是像素。
  # - electron#47419：Electron 36.x 上 `_electron.launch()` 会
  #   "Process failed to launch!"。本仓库钉的是 electron ^43.3.0，不在受影响
  #   区间；而且该 issue 里报的失败集中在 Linux CI，Windows runner 未受影响。
  #   升级 Electron 大版本时值得回头看一眼这个 issue。
  # - 超时：Windows runner 冷启动 + Defender 实时扫描比 Linux 慢得多。
  #   e2e 侧已有 MOUNT_TIMEOUT_MS=60s / testTimeout=120s 的余量，job 级再兜一层
  #   timeout-minutes，免得挂死占满 6 小时默认上限。
  # ────────────────────────────────────────────────────────────────
  smoke-windows:
    name: smoke e2e (windows, ConPTY + 真 shell)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 同 build job：版本只从 package.json 的 packageManager 读。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      # 同 build job：prost-build 不自带 protoc。
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # shell: bash 显式声明——windows runner 的默认 shell 是 pwsh，下面这段
      # 用的是 POSIX 循环语法。GitHub 的 windows 镜像自带 Git Bash，可以直接用。
      - name: Install dependencies (pnpm install, retry x3)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          echo "pnpm install failed after 3 attempts"
          exit 1

      # 跑的是**真实构建产物**，这两步缺一不可。
      - name: Build native module (napi-rs)
        run: pnpm build:native

      - name: Build Electron app
        run: pnpm build

      # 不套 xvfb：Windows 有原生窗口系统，scripts/run-e2e.mjs 里那层包装的判据
      # 就是「Linux 且没有 DISPLAY」，在这里自然不会触发，直接跑 vitest。
      - name: E2E smoke (Playwright + real Electron + ConPTY + real shell)
        run: pnpm test:e2e

  # ────────────────────────────────────────────────────────────────
  # latency-windows：把「键盘 → PTY → 屏幕」的时延分段测量搬到 CI，
  # 结果直接写进 Actions 的**运行摘要页**。
  #
  # 为什么必须搬到 CI：用户只下载打包好的 zip，本机没有 Node / Rust / pnpm，
  # `pnpm measure:latency` 他跑不了。摘要页是唯一一个"点开就能读、不用下载
  # 任何东西"的位置，所以产出落在 $GITHUB_STEP_SUMMARY，而不是 artifact。
  #
  # 跑两组测量：
  # 1. crates/ht-core/examples/pty_latency.rs —— 纯 Rust + ConPTY，不含
  #    napi / MessagePort / xterm。这是"ConPTY 自己要多久"的基准线。
  # 2. pnpm measure:latency —— 完整 Electron 链路，输出 PTY / NAPI / FULL 三段。
  # 摘要页把两组数字和它们的比值排成表格，回答那个真正的问题：
  # **键盘往返总时延里，ConPTY 自己占多少，我们的 IPC + 渲染占多少。**
  #
  # 【不当门禁：continue-on-error 加在"测量"那几步上，不加在 job 上】理由：
  # 这个 job 是**测量**，不是**判定**。没有阈值可判——runner 的绝对毫秒数
  # 不可外推到用户真机（无 GPU、共享 vCPU 的 Windows Server 虚拟机），拿它
  # 设红线只会制造一堆没人能处理的假警报。它的价值全部在摘要页那张表上，
  # 表在就行，红绿灯留给 smoke-windows。
  # 但也不是"整个 job 一律不红"：continue-on-error 只挂在构建和两步测量上，
  # checkout / setup / pnpm install 这些**基础设施**步骤照常能把 job 弄红——
  # 那类失败说明 CI 配置本身坏了，是必须有人去修的，不该被一起消音。
  # 注意它和 verify 的定位**不一样**：verify 是"预期会红"的探针，这个是
  # "预期会绿、但红了不拦人"。所以没有把它塞进 verify——塞进去，摘要页里
  # 这张表就会淹没在一堆预期失败里，没人再当回事。
  # 摘要那一步挂 if: always()，测量挂了也照样写一页说明（而不是一片空白）。
  # ────────────────────────────────────────────────────────────────
  # 【timeout-minutes 为什么从 60 收到 20】
  # 这个 job 连着两次挂死（60 分钟一次、29 分钟一次），两次都停在同一行日志
  # "· NAPI 段…" 之后再无输出。60 分钟对一个正常跑十来分钟的 job 来说等于
  # **没有超时**——挂死和慢，从超时的角度看分辨不出来。而 Windows runner 是
  # **双倍计费**，挂死一次就是一小时的真钱。
  #
  # 四层超时，从内到外必须保持 段 < 总兜底 < 步骤 < job 的大小关系：
  #   1. 每一次等待（CDP 调用、连核心、开会话、cargo run）  各自 30-40 秒
  #   2. 每一段测量（PTY / NAPI / FULL）                    4 / 3 / 4 分钟
  #   3. 脚本总兜底（e2e/latency.ts 的 overallWatchdog）     12 分钟
  #   4. 步骤级 timeout-minutes                             ConPTY 5、测量 13
  #   5. job 级 timeout-minutes                             20   ← 本行
  # 内层先开火，失败信息才说得清是**哪一步**挂的；job 级只是最后一道闸。
  #
  # 【20 分钟故意**小于**各层最坏情况之和，这是有意的】
  # 把 4 和 5 层全部按最坏叠加是 10（install+两次 build）+ 5 + 13 = 28 分钟。
  # 但"所有层同时触顶"这件事本身就是故障，不是正常运行——正常运行是
  # install+build 约 8-10 分钟 + ConPTY 约 1 分钟 + 测量约 2 分钟 ≈ 13 分钟。
  # 20 分钟给正常运行留了 50% 余量，同时把最坏情况的止损点从一小时压到 20 分钟。
  # **如果哪天这个 job 在健康状态下被 20 分钟砍掉，正确做法是去看日志里哪一步
  # 吃掉了时间（每步都有耗时），而不是把这个数字调回 60。**
  latency-windows:
    name: latency (windows, ConPTY vs 我们的 IPC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (pnpm install, retry x3)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          echo "pnpm install failed after 3 attempts"
          exit 1

      # 时延测量跑的同样是真实构建产物（out/ + 真 .node），顺带也把 ht-core 的
      # release 产物预热进 cargo target 里，下面那个 example 就不用从头编。
      - name: Build native module (napi-rs)
        continue-on-error: true
        run: pnpm build:native

      - name: Build Electron app
        continue-on-error: true
        run: pnpm build

      # ConPTY 基准线：同一个 example 连跑 3 轮，样本合池到一个日志里。
      # 为什么跑 3 轮：单轮 n=60 时 p95 只由最靠上的 3 个样本决定，在共享 CPU 的
      # runner 上那 3 个样本基本是噪声。单轮只要两三秒，多跑几轮把 n 抬到 180，
      # p95 才勉强说得上有意义。（不改 example 里的 SAMPLES 常量——本轮不动
      # crates/ 下的既有代码，多跑几遍在外面合池是等价且零侵入的做法。）
      - name: Measure ConPTY roundtrip (纯 Rust, ×3)
        continue-on-error: true
        # 单轮**正常**约 10 秒（80 轮 × 约 120ms），3 轮加起来半分钟上下，首轮可能
        # 要现编 example。5 分钟是给"从端一直不回显、每轮都撞 2 秒上限"那种最坏
        # 情况的止损点：那时单轮 ≈ 170 秒、3 轮 ≈ 8.5 分钟，会在这里被砍掉，
        # 而不是一路拖到 job 级超时。砍掉也无妨——下一步和摘要页照常跑，
        # 摘要会写明这一节"未测到"。
        timeout-minutes: 5
        shell: bash
        run: |
          : > latency-conpty.log
          for i in 1 2 3; do
            echo "── run $i/3 ──"
            cargo run -p ht-core --release --example pty_latency 2>&1 | tee -a latency-conpty.log
          done

      # 完整链路。tee 一份到文件供下面生成摘要，同时原样留在 job 日志里，
      # 摘要上的数字随时可以回来对账。
      # 注：GitHub 的 `shell: bash` 默认带 `-eo pipefail`，管道里 pnpm 挂了这一步
      # 就会红（然后被 continue-on-error 接住），不会出现"测量失败但步骤是绿的"。
      # 脚本自己有三段硬上限（4+3+4=11 分钟）和一个 12 分钟的总兜底；这一步的
      # timeout-minutes(13) 是它们全部失效时的最后一道，job 级的 20 再兜一层。
      # 这四个数字必须保持 11 < 12 < 13 < 20 这个大小关系，改一个就要回来看其余的。
      # 正常跑完只要 1-2 分钟——这些数字全是止损点，不是预期时长。
      #
      # 注：脚本现在会在**任何一段有效样本不够**时以非零退出码收尾（见
      # e2e/latency.ts 的「本次测量的有效性」一节）。continue-on-error 让它不拦人，
      # 但步骤会显示成红色、摘要页也会写明哪段没测到——而不是绿油油地贴一张
      # 基于三个样本的假表。
      - name: Measure full Electron chain (pnpm measure:latency)
        continue-on-error: true
        timeout-minutes: 13
        shell: bash
        run: pnpm measure:latency 2>&1 | tee latency-full.log

      # 摘要页。if: always() —— 上面任何一步挂了，这里也要写一页出来，
      # 明确告诉读者哪一节"未测到"，而不是留一片空白让人以为埋点没生效。
      - name: Write latency summary to run page
        if: always()
        shell: bash
        run: node scripts/latency-summary.mjs latency-conpty.log latency-full.log >> "$GITHUB_STEP_SUMMARY"

      # 原始日志留档：摘要页只放结论，真要复核分布/看某一轮为什么超时，得看原文。
      # 路径和 build job 的 release/*.zip 完全无关，不影响用户下载安装包。
      - name: Upload raw measurement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-logs-windows
          path: |
            latency-conpty.log
            latency-full.log
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────
  # selfhosted-diagnose：自托管 runner（用户自己的 Win11 笔记本）的**环境诊断**。
  #
  # 这个 job 不测代码，测的是**那台机器**。要回答的问题只有一个：
  # 「装成 Windows 服务、跑在 NT AUTHORITY\NETWORK SERVICE 名下的这个 runner，
  #   到底能替我们验证什么，不能验证什么？」
  # 现在只能靠猜（"Session 0 大概没有桌面吧"），而猜出来的结论会直接影响我们
  # 把哪些测试放上去、又相信它们到什么程度。所以让机器自己把事实打印出来。
  #
  # 最有价值的一项是**真实冷启动耗时**：用户真机上 `main:fork_call →
  # main:core_spawn` 这一段曾经是 81 秒，关掉杀毒后掉到 504ms。那一轮排查是靠人
  # 反复下载安装包手动开、一轮一天查出来的。这里用 `pnpm measure:startup`
  # （e2e/startup-timeline.ts）把同一段变成可持续观测的自动化口径——**复用的是
  # 现成的埋点**（src/main/startup-timing.ts + 页面诊断日志），没有另起一套。
  #
  # ── 【安全门禁】if: github.event_name != 'pull_request' ──────────────────
  # 这一行是**必须的**，不是可选优化。本仓库是**公开仓库**，而自托管 runner
  # 默认会接 fork 过来的 PR 的任务——也就是说，任何陌生人只要发一个 PR，改一行
  # workflow 或者往测试里塞一句命令，就能在用户自己的笔记本上执行任意代码
  # （读文件、拿凭据、装东西）。GitHub 官方文档在 "Self-hosted runner security"
  # 里明确写了不建议公开仓库使用自托管 runner，正是这个原因。
  # 用户选择接受这个风险并自己把关 PR，这条事件门禁是**纯代码层面的补充保险**：
  # 就算哪天仓库设置被改回"允许 fork PR 跑 workflow"，这一行仍然会让所有
  # pull_request 事件跳过本 job。
  # **今后任何新增的 runs-on: self-hosted 的 job 都必须照抄这一行。**
  #
  # ── 【shell 一律用 powershell / 不用 pwsh，也不用 bash】────────────────────
  # 这个 job 在用户真机上跑过一次，第一步就死在：
  #     ##[error]pwsh: command not found
  # 原因很朴素：**用户的 Win11 上只有 Windows PowerShell 5.1（powershell.exe），
  # 没有装 PowerShell 7（pwsh.exe）**。而 GitHub 托管的 windows-latest 镜像预装了
  # pwsh，所以同一行 `shell: pwsh` 在托管 runner 上一直是绿的——我们照抄过来时
  # 默认"Windows 就是 Windows"，这个假设是错的：**托管镜像装了一堆东西，用户的
  # 机器是裸的**。自托管 job 里能依赖的只有 Windows 自带的东西。
  #
  # 同理，这个 job 里原本几步 `shell: bash` 也一并换掉了。bash 在 Windows 上来自
  # Git for Windows，虽然装了 runner 多半也装了 git，但那同样是个"大概装了吧"的
  # 假设——而上面这次失败正是这类假设的产物，而且因为它挂在第一步，我们连
  # bash 到底在不在都没能验证到。powershell.exe 是**系统组件**，任何 Windows 上
  # 都在，这是唯一不需要假设的选择。
  # 下面那几段 PowerShell 因此也必须守 5.1 的语法（没有 `??`、没有三元运算符、
  # 没有 `ForEach-Object -Parallel`），写的时候注意。
  # **今后任何 runs-on: self-hosted 的 job 都照这条办。**
  #
  # ── 【continue-on-error: true，加在 job 上】理由 ────────────────────────
  # 这是一台**个人笔记本**，会关机、会合盖、会断网。runner 离线时这个 job 会一直
  # 排队直到超时，超时就是失败——而那种失败说明的是"笔记本没开机"，不是"代码坏
  # 了"，绝不该拦住任何别人的合并。所以整个 job 挂 continue-on-error。
  # 同时配 timeout-minutes，免得离线时挂满 6 小时默认上限白占额度。
  # 它跟 verify 那种"预期会红"的定位也不一样：这个 job 预期会绿，只是**预期
  # 可能压根跑不起来**。红绿灯仍然是 smoke / smoke-windows。
  #
  # ── 【读到这里的人请先读这一段】同一个模式已经连踩五次 ──────────────────
  # 「**GitHub 托管 runner 的环境 ≠ 用户机器的环境**」。托管的 windows-latest 是
  # 一台按 CI 需要装满了东西、区域设置是 en-US 的镜像；用户那台是中文 Win11 笔记本，
  # 装的是他自己那套软件。每一次我们把托管 runner 上跑绿的写法照抄过来，都会撞上
  # 一条"在那边成立、在这边不成立"的隐含假设。已经踩中的五次：
  #   1. `shell: pwsh`      → 用户机器只有 Windows PowerShell 5.1，没装 PowerShell 7
  #                           （##[error]pwsh: command not found）
  #   2. `shell: bash`      → `bash` 命中 C:\Windows\System32\bash.exe（WSL 的转发器，
  #                           而且没装任何发行版），不是 Git for Windows 的 bash
  #   3. `git`              → 命中 SourceTree 自带的那份 git，不是我们以为的那份
  #   4. `Get-MpPreference` → 用户为了排查启动慢**把 Defender 关了**，cmdlet 直接报错
  #                           （0x800106ba），而且报的是非终止错误，catch 接不住
  #   5. 脚本文件编码       → runner 把 `run:` 落成 UTF-8 无 BOM 的临时 .ps1，而中文
  #                           Windows 的 PowerShell 5.1 **按系统 ANSI 代码页（GBK）读
  #                           脚本文件**。脚本里的中文被解成乱码，其中恰好有能撑破
  #                           字符串引号的字节 → 整个脚本 ParserError → 第一步就没跑
  #                           成 → 后面全部 skipped。
  # 五次的共同点：**在托管 runner 上一直是绿的，所以我们从来没验证过那个假设**。
  #
  # **给这个 job 加任何一步之前，先把这句问一遍**：
  #   "这条在 PowerShell 5.1 + 中文区域设置 + 没有 pwsh + bash 是 WSL 的机器上，
  #    会怎样？"
  # 答不上来就别写。三条已经固化成规矩的结论：
  #   * shell 一律 powershell（见上），语法守 5.1；
  #   * **脚本内容必须是纯 ASCII**——注释、字符串字面量都算。中文文案放
  #     `.github/selfhosted-diagnose-summary.zh-CN.md`，脚本显式按 UTF-8 读进来。
  #     （YAML 层的注释——就是你现在读的这种，`- name:` / `run:` 之外的 `#` 行——
  #     会被 YAML 解析器吃掉，**根本进不了那个 .ps1 文件**，所以尽管写中文。
  #     区别只在于：`run: |` 块**里面**的 `#` 注释是脚本内容，必须 ASCII。）
  #   * 任何"查一下环境"的调用都当它会失败：-ErrorAction Stop + try/catch，
  #     catch 里如实写"未获取到 + 原因"，绝不用默认值冒充查询结果。
  # ────────────────────────────────────────────────────────────────
  selfhosted-diagnose:
    name: self-hosted 环境诊断 (DESKTOP-8GCTKR2)
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 60
    # 【关键一行】把本 job 所有 run 步骤的默认 shell 钉成 powershell（5.1）。
    # 不这么写的话，没有显式声明 shell 的步骤会走 GitHub 在 Windows 上的默认值
    # **pwsh**——正是那个在这台机器上不存在的东西。放在 job 级而不是逐步声明，
    # 是为了让"以后有人加了一步但忘了写 shell:"这件事不再能重新引入同一个故障。
    defaults:
      run:
        shell: powershell
    steps:
      # ── 【第 0 步：什么都不干，只把编码打出来】────────────────────────
      # 存在的理由：本 job 上一次真机运行整个红了，而日志里能看到的只有一屏乱码
      #     + Write-Host ("鍚﹀喅 $root锛歜ash 璺戜笉閫氾紙杈撳嚭锛?probe锛?)
      #     The string is missing the terminator: ".
      # 病因得把乱码反解回 UTF-8 才猜得出来（原文是"否决 $root：bash 跑不通…"）。
      # 那次排查的时间几乎全花在"确认 5.1 到底按哪个编码读 .ps1 文件"上——
      # 这一步就是把那几个数字直接打出来，下次五秒定位，不用再靠读乱码反推。
      #
      # 必须是**最靠前**的一步（比 PATH 修正还早）：它不依赖任何东西，而它回答的
      # 那个问题（编码）恰恰是后面每一步能不能跑起来的前提。
      # continue-on-error：诊断探针本身永远不该拦住诊断。
      #
      # 最关键的一行是 probe_ansi_codepage：Windows PowerShell 5.1 跑在 .NET
      # Framework 上，`[System.Text.Encoding]::Default` **就是系统 ANSI 代码页**，
      # 也就是 powershell.exe 从磁盘读脚本文件时用的那个编码。中文机器上它会是
      # gb2312/936。只要它不是 utf-8，"脚本里不许出现非 ASCII"这条规矩就一直有效。
      # （对照组：PowerShell 7 跑在 .NET Core 上，同一个属性返回 utf-8——这正是
      # 为什么这个坑在托管 runner 的 pwsh 上永远不会出现。）
      - name: 环境探针：PowerShell 版本与编码（纯 ASCII，最先跑）
        id: probe
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # ASCII ONLY in this script. See the job header comment: on a
          # Chinese-locale Windows box, powershell.exe 5.1 reads this file using
          # the system ANSI code page (GBK), so any non-ASCII byte here comes
          # back as mojibake and can break the parser. Chinese labels for these
          # keys live in .github/selfhosted-diagnose-summary.zh-CN.md and are
          # applied later by the summary step.
          $out = New-Object System.Collections.Generic.List[string]
          # One fact per line, TAB-separated -- so a value that carries its own
          # newlines or tabs (bash probe output, a multi-line error message)
          # would silently corrupt every row after it. Flatten it here.
          function Add-Fact($k, $v) {
            $s = ("$v" -replace '[\r\n\t]+', ' ').Trim()
            $out.Add("$k`t$s")
          }

          Add-Fact 'probe_ps_version' $PSVersionTable.PSVersion.ToString()
          Add-Fact 'probe_ps_edition' "$($PSVersionTable.PSEdition)"
          Add-Fact 'probe_ps_host' "$($Host.Name) $($Host.Version)"

          # Console encodings can throw in a non-interactive service session,
          # so each one gets its own try/catch and reports the failure instead
          # of taking the whole probe down.
          try {
            Add-Fact 'probe_console_output_encoding' ("$([Console]::OutputEncoding.WebName) (cp$([Console]::OutputEncoding.CodePage))")
          } catch { Add-Fact 'probe_console_output_encoding' "@query-failed@ $($_.Exception.Message)" }
          try {
            Add-Fact 'probe_console_input_encoding' ("$([Console]::InputEncoding.WebName) (cp$([Console]::InputEncoding.CodePage))")
          } catch { Add-Fact 'probe_console_input_encoding' "@query-failed@ $($_.Exception.Message)" }
          try {
            Add-Fact 'probe_output_encoding_var' "$($OutputEncoding.WebName)"
          } catch { Add-Fact 'probe_output_encoding_var' "@query-failed@ $($_.Exception.Message)" }

          # THE decisive number: on .NET Framework this IS the system ANSI code
          # page, i.e. the encoding powershell.exe uses to read a script file.
          try {
            Add-Fact 'probe_ansi_codepage' ("$([System.Text.Encoding]::Default.WebName) (cp$([System.Text.Encoding]::Default.CodePage))")
          } catch { Add-Fact 'probe_ansi_codepage' "@query-failed@ $($_.Exception.Message)" }

          try {
            Add-Fact 'probe_chcp' ((& chcp.com | Out-String).Trim())
          } catch { Add-Fact 'probe_chcp' "@query-failed@ $($_.Exception.Message)" }

          Add-Fact 'probe_culture' ([System.Globalization.CultureInfo]::CurrentCulture.Name)
          Add-Fact 'probe_ui_culture' ([System.Globalization.CultureInfo]::CurrentUICulture.Name)

          $out | Write-Host

          # Hand these facts to the summary step. RUNNER_TEMP is used rather
          # than the workspace because actions/checkout wipes the workspace,
          # and this step runs before checkout. Write (not append) so a leftover
          # file from an earlier run on this self-hosted box cannot bleed in.
          $pre = Join-Path $env:RUNNER_TEMP 'ht-preflight.tsv'
          [System.IO.File]::WriteAllLines($pre, [string[]]$out, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "preflight facts written to $pre"

          # Explicit exit 0: the GitHub powershell wrapper appends
          # `exit $LASTEXITCODE`, and chcp.com above is a native command.
          exit 0

      # ── 【必须在 checkout 之前】把 PATH 修正到"我们要的那个 bash / git" ──
      #
      # 真机上这个 job 死在 `dtolnay/rust-toolchain` 那一步，日志是：
      #     shell: C:\Windows\system32\bash.EXE --noprofile --norc -e -o pipefail {0}
      #     wsl: Failed to translate 'D:\phpstudy_pro\...'
      #     <3>WSL (…) ERROR: execvpe(/bin/bash) failed: No such file or directory
      # 也就是说 `bash` 命中的是 **WSL 的 bash**（C:\Windows\System32\bash.exe，
      # 一个没装任何发行版的转发器），不是 Git for Windows 的 bash。托管 runner 上
      # `C:\Windows\System32` 排在 Git 后面，所以这个坑从来没暴露过；用户机器上
      # 顺序反过来了。
      #
      # 为什么必须用改 PATH 的办法解决，而不是"这一步别用 bash"：
      # 触发它的是**第三方 action 内部**的 `shell: bash`（dtolnay/rust-toolchain 的
      # action.yml 就是这么写的），我们改不了别人的 action。能改的只有它看到的 PATH。
      # $GITHUB_PATH 写进去的目录会被**前置**到后续所有步骤（包括 JS action）的
      # PATH 前面，正好覆盖这个场景。
      #
      # 顺带解决同一份日志里的第二个问题（同一个病因）：
      #     [command]C:\Users\…\Atlassian\SourceTree\git_local\bin\git.exe reset --hard HEAD
      # checkout 用的是 SourceTree 自带的那个 git。把选中的 Git 安装的 cmd 目录一并
      # 前置，`git` 也就跟着钉死了。
      #
      # 判据是**跑一次 bash 看它答不答应**，而不是"文件存在就算数"：WSL 那个
      # bash.exe 文件同样存在，只有真的执行一次才分得出来。查不到就把事实明明白白
      # 记下来（哪些候选、各自为什么被否），绝不静默继续——静默继续的结果就是下一步
      # 又炸在同一个地方，而日志里看不出为什么。
      #
      # ── 下面这些本来是写在脚本里的中文注释，现在搬到 YAML 层 ────────────
      # （YAML 注释会被解析器吃掉，进不了那个临时 .ps1 文件，所以这里写中文是安全的；
      #   写在 `run: |` 块**里面**就会被 5.1 按 GBK 读、变乱码、撑破语法。）
      # * 候选 Git 安装根目录：先看 PATH 上现有的 git（含 SourceTree 自带的那份，
      #   它本身就是一份 Git for Windows），再补几个常见安装位置。
      #   `…\Git\cmd\git.exe` 或 `…\Git\bin\git.exe` → 取上上层。
      # * 写 $GITHUB_PATH 用 .NET 的无 BOM UTF-8：5.1 的 Add-Content 默认写系统
      #   ANSI 代码页（中文 Windows 上是 GBK），路径里有非 ASCII 就会被写坏，
      #   而且不报错。
      # * 脚本只记 ASCII 的键值对和 `@记号@`，面向人的中文结论一律由摘要步骤查表
      #   还原（表在 .github/selfhosted-diagnose-summary.zh-CN.md）。
      # * 【必须显式 exit 0】GitHub 的 powershell 包装器会在脚本末尾追加
      #   `exit $LASTEXITCODE`，而上面跑过 where.exe / bash.exe 这些**原生命令**
      #   ——只要最后一个原生命令是非零退出（例如 `where.exe bash` 什么都没找到，
      #   它返回 1），这一步就会以失败告终。而 job 级的 continue-on-error 只保证
      #   工作流不被判红，**不会**让后续步骤继续执行：这一步一红，整个诊断就没了。
      #   这一步的职责是"尽力修 PATH 并如实汇报"，它本身不该有失败这个结局。
      - name: 修正 PATH（bash → Git for Windows，不要 WSL；git → 同一份安装）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # ASCII ONLY in this script -- see the job header comment.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $pre = Join-Path $env:RUNNER_TEMP 'ht-preflight.tsv'
          $facts = New-Object System.Collections.Generic.List[string]
          # One fact per line, TAB-separated -- so a value that carries its own
          # newlines or tabs (bash probe output, a multi-line error message)
          # would silently corrupt every row after it. Flatten it here.
          function Add-Fact($k, $v) {
            $s = ("$v" -replace '[\r\n\t]+', ' ').Trim()
            $facts.Add("$k`t$s")
          }

          Write-Host '--- PATH before ---'
          $bashBefore = ((where.exe bash 2>$null) -join ' | ')
          $gitBefore = ((where.exe git 2>$null) -join ' | ')
          if (-not $bashBefore) { $bashBefore = '@not-found@' }
          if (-not $gitBefore) { $gitBefore = '@not-found@' }
          Write-Host "bash: $bashBefore"
          Write-Host "git : $gitBefore"
          Add-Fact 'pathfix_bash_before' $bashBefore
          Add-Fact 'pathfix_git_before' $gitBefore

          $roots = New-Object System.Collections.Generic.List[string]
          foreach ($g in @(Get-Command git.exe -All -ErrorAction SilentlyContinue)) {
            $root = Split-Path (Split-Path $g.Source -Parent) -Parent
            if ($root) { $roots.Add($root) }
          }
          foreach ($p in @(
            "$env:ProgramFiles\Git",
            "${env:ProgramFiles(x86)}\Git",
            "$env:LOCALAPPDATA\Programs\Git",
            "$env:LOCALAPPDATA\Atlassian\SourceTree\git_local"
          )) { if ($p -and (Test-Path $p)) { $roots.Add($p) } }

          $candidates = @($roots | Select-Object -Unique)
          Add-Fact 'pathfix_candidates' $(if ($candidates.Count) { $candidates -join ' ; ' } else { '@none@' })

          $chosen = $null
          $rejected = New-Object System.Collections.Generic.List[string]
          foreach ($root in $candidates) {
            $bash = Join-Path $root 'bin\bash.exe'
            if (-not (Test-Path $bash)) {
              Write-Host "reject $root : no bin\bash.exe"
              $rejected.Add("@rejected-no-bash-exe@ $root")
              continue
            }
            # Actually run it. The WSL stub fails here or prints something else.
            $probe = (& $bash -c 'echo ht-bash-ok' 2>&1 | Out-String).Trim()
            if ($probe -like '*ht-bash-ok*') { $chosen = $root; break }
            Write-Host "reject $root : bash probe failed, output: $probe"
            $rejected.Add("@rejected-probe-failed@ $root [$probe]")
          }
          Add-Fact 'pathfix_rejected' $(if ($rejected.Count) { $rejected -join ' ; ' } else { '@none@' })

          if ($chosen) {
            $lines = @((Join-Path $chosen 'cmd'), (Join-Path $chosen 'bin'))
            [System.IO.File]::AppendAllLines($env:GITHUB_PATH, [string[]]$lines, $utf8NoBom)
            Write-Host "chosen Git install: $chosen"
            Write-Host ('prepended to PATH: ' + ($lines -join ' ; '))
            Add-Fact 'pathfix_chosen' $chosen
            Add-Fact 'pathfix_prepended' ($lines -join ' ; ')
          } else {
            Write-Host '::warning::No working Git-for-Windows bash found. Actions that hardcode "shell: bash" (e.g. dtolnay/rust-toolchain) will hit the WSL stub at C:\Windows\System32\bash.exe and fail. Fix: install Git for Windows on this machine.'
            Add-Fact 'pathfix_chosen' '@chosen-none@'
            Add-Fact 'pathfix_prepended' '@none@'
          }

          [System.IO.File]::AppendAllLines($pre, [string[]]$facts, $utf8NoBom)

          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      # ── 事实采集①：我是谁、跑在哪个会话里 ──────────────────────────
      # 全部包 try/catch：NETWORK SERVICE 权限受限，任何一条查询都可能被拒，
      # 而"这条查不到"本身就是有用的结论，不该让整步炸掉把其余事实一起带走。
      #
      # ── 下面这些本来是写在脚本里的中文注释，现在搬到 YAML 层 ────────────
      # （原因见 job 顶部：`run: |` 块里的内容会原样落进临时 .ps1，5.1 按 GBK 读它。）
      #
      # * 【窗口站 / 桌面】Session 0 的服务进程拿到的是非交互式窗口站（典型名字
      #   Service-0x0-3e4$），它没有可见桌面。这是"能不能做真·桌面 UI 自动化"的
      #   直接判据，值得为它写一段 P/Invoke 而不是靠推断。
      # * 【为什么不用 here-string】PowerShell 的 here-string 结束符 `'@` 必须顶格
      #   写在行首，而 YAML 块标量要求所有内容缩进都比 `run:` 深——两个规则直接
      #   打架，写成 here-string 会让整个 workflow YAML 解析失败（已实测踩到）。
      #   改成字符串数组 join，缩进随便加，两边都满意。
      # * 【为什么不写 -UsingNamespace】真机上这段报过：
      #       Add-Type : …(3) : 视为错误的警告:
      #       "System.Runtime.InteropServices"的 using 指令以前在此命名空间中出现过
      #   `Add-Type -MemberDefinition` 生成的桩代码**自带** `using
      #   System.Runtime.InteropServices;`，我们又用 -UsingNamespace 加了一遍 →
      #   重复 using 触发 CS 警告，而 5.1 的 Add-Type 把警告当错误（托管 runner 上
      #   是 pwsh 7，编译器版本不同所以一直没报）。修法不是"删掉重复的那一个"就
      #   完事——那样下次谁再加一个 -UsingNamespace 又会重来。这里**整个不用
      #   -UsingNamespace**，签名里的类型一律写全名（System.Text.StringBuilder），
      #   从形状上就不可能再撞。DllImport / CharSet 保持短名：它们来自自带的那条
      #   using，本来就没问题。
      # * 【Defender 那两段】真机日志里出现过：
      #       Get-MpPreference : Operation failed with the following error: 0x800106ba
      #   用户为了排查启动慢**把 Defender 关了**，服务没跑，cmdlet 直接报错。
      #   原来的写法有两个毛病：① `try/catch` **接不住**它——PowerShell 的 cmdlet
      #   报的是**非终止错误**，只有 `-ErrorAction Stop` 才会变成终止错误进 catch；
      #   ② 于是代码继续往下走，`$pref` 是 $null，表格里落下一行
      #   `defender_exclusions = (无)`——一个**编出来的假状态**。"没有排除项"和
      #   "压根查不到"是两回事，前者会让下一轮排查直接走错方向。本项目的老规矩：
      #   宁可写"未获取到"，不许编数字。所以：-ErrorAction Stop 让 catch 真的生效，
      #   catch 里如实记 `@unavailable@ + 原因`；另补一条 WinDefend 服务状态，
      #   它能一句话回答"是关了还是没权限查"。
      # * 【`@记号@` 是什么】脚本必须纯 ASCII，所以像"（无）""未获取到"这类**中文
      #   字面量**一律写成 ASCII 记号，由摘要步骤查
      #   .github/selfhosted-diagnose-summary.zh-CN.md 的 values 表还原成中文。
      #   注意区分 `@none@`（真的查到了、结果是空）和 `@unavailable@`（压根没查到）。
      # * 【写文件不用 Out-File】5.1 的 `-Encoding utf8` 写的是**带 BOM** 的 UTF-8，
      #   而这份表格随后要被读回来拼进摘要页，BOM 会变成第一行行首一个看不见的
      #   怪字符。用 .NET 写无 BOM UTF-8，两边都干净。
      - name: 采集运行环境事实
        id: facts
        # powershell（5.1）而不是 pwsh（7）：用户机器上没有 pwsh，见 job 顶部注释。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # ASCII ONLY in this script -- see the job header comment.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $out = New-Object System.Collections.Generic.List[string]
          # One fact per line, TAB-separated -- so a value that carries its own
          # newlines or tabs (bash probe output, a multi-line error message)
          # would silently corrupt every row after it. Flatten it here.
          function Add-Fact($k, $v) {
            $s = ("$v" -replace '[\r\n\t]+', ' ').Trim()
            $out.Add("$k`t$s")
          }

          # Carry over what the encoding probe and the PATH fix recorded before
          # checkout wiped the workspace. Read with an explicit UTF-8 decoder:
          # values can hold localized (non-ASCII) runtime text, and Get-Content
          # on 5.1 would decode the file as the system ANSI code page instead.
          $pre = Join-Path $env:RUNNER_TEMP 'ht-preflight.tsv'
          if (Test-Path $pre) {
            foreach ($l in [System.IO.File]::ReadAllLines($pre, $utf8NoBom)) {
              if ($l.Trim().Length -gt 0) { $out.Add($l) }
            }
          } else {
            Add-Fact 'preflight' '@unavailable@ ht-preflight.tsv'
          }

          Add-Fact 'whoami' (whoami)
          Add-Fact 'machine' $env:COMPUTERNAME
          Add-Fact 'session_id' (Get-Process -Id $PID).SessionId
          Add-Fact 'user_interactive' ([Environment]::UserInteractive)
          Add-Fact 'os' (Get-CimInstance Win32_OperatingSystem).Caption
          Add-Fact 'cpu' (Get-CimInstance Win32_Processor).Name
          Add-Fact 'cores' ([Environment]::ProcessorCount)
          Add-Fact 'ram_gb' ([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1))

          try {
            $sig = @(
              '[DllImport("user32.dll")]',
              'public static extern IntPtr GetProcessWindowStation();',
              '[DllImport("user32.dll")]',
              'public static extern IntPtr GetThreadDesktop(uint dwThreadId);',
              '[DllImport("kernel32.dll")]',
              'public static extern uint GetCurrentThreadId();',
              '[DllImport("user32.dll", CharSet = CharSet.Unicode)]',
              'public static extern bool GetUserObjectInformation(IntPtr hObj, int nIndex, System.Text.StringBuilder pvInfo, int nLength, out int lpnLengthNeeded);'
            ) -join [Environment]::NewLine
            Add-Type -Namespace HT -Name U -MemberDefinition $sig
            $sb = New-Object System.Text.StringBuilder 256
            $n = 0
            # nIndex = 2 (UOI_NAME)
            [void][HT.U]::GetUserObjectInformation([HT.U]::GetProcessWindowStation(), 2, $sb, 256, [ref]$n)
            Add-Fact 'window_station' $sb.ToString()
            $sb2 = New-Object System.Text.StringBuilder 256
            [void][HT.U]::GetUserObjectInformation([HT.U]::GetThreadDesktop([HT.U]::GetCurrentThreadId()), 2, $sb2, 256, [ref]$n)
            Add-Fact 'desktop' $sb2.ToString()
          } catch { Add-Fact 'window_station' "@query-failed@ $($_.Exception.Message)" }

          # Session 0 usually enumerates no monitor at all; that IS the finding.
          try {
            $gpus = (Get-CimInstance Win32_VideoController | ForEach-Object { $_.Name }) -join '; '
            Add-Fact 'video_controllers' $(if ($gpus) { $gpus } else { '@none@' })
          } catch { Add-Fact 'video_controllers' "@query-failed@ $($_.Exception.Message)" }
          try {
            $mons = @(Get-CimInstance Win32_DesktopMonitor).Count
            Add-Fact 'desktop_monitors' $mons
          } catch { Add-Fact 'desktop_monitors' "@query-failed@ $($_.Exception.Message)" }

          # Defender: prime suspect for the 81s cold start, so record its exact
          # state. -ErrorAction Stop is load-bearing (see the YAML comment).
          try {
            $svc = Get-Service -Name WinDefend -ErrorAction Stop
            Add-Fact 'defender_service' $svc.Status
          } catch { Add-Fact 'defender_service' "@unavailable@ $($_.Exception.Message)" }
          try {
            $mp = Get-MpComputerStatus -ErrorAction Stop
            Add-Fact 'defender_realtime' $mp.RealTimeProtectionEnabled
            Add-Fact 'defender_engine' $mp.AMEngineVersion
          } catch {
            Add-Fact 'defender_realtime' "@defender-unavailable@ $($_.Exception.Message)"
            Add-Fact 'defender_engine' '@unavailable@'
          }
          try {
            $pref = Get-MpPreference -ErrorAction Stop
            $ex = ($pref.ExclusionPath -join '; ')
            # '@none-confirmed@' means the query DID succeed and came back empty
            # -- kept strictly distinct from '@unavailable@' in the catch below.
            Add-Fact 'defender_exclusions' $(if ($ex) { $ex } else { '@none-confirmed@' })
          } catch { Add-Fact 'defender_exclusions' "@unavailable@ $($_.Exception.Message)" }

          Add-Fact 'workspace' $env:GITHUB_WORKSPACE
          Add-Fact 'ps_version' $PSVersionTable.PSVersion.ToString()
          Add-Fact 'ps_edition' $PSVersionTable.PSEdition
          $pwshPath = (Get-Command pwsh -ErrorAction SilentlyContinue)
          Add-Fact 'pwsh_available' $(if ($pwshPath) { $pwshPath.Source } else { '@no-pwsh@' })
          $bashPath = (Get-Command bash -ErrorAction SilentlyContinue)
          Add-Fact 'bash_available' $(if ($bashPath) { $bashPath.Source } else { '@no-bash@' })

          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location).Path 'env-facts.tsv'),
            [string[]]$out,
            $utf8NoBom
          )
          # Echo from memory, not `Get-Content env-facts.tsv`: that cmdlet would
          # re-read the UTF-8 file as the system ANSI code page.
          $out | Write-Host

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 同上：不用 bash（Windows 上它来自 Git for Windows，不是系统组件）。
      # PowerShell 5.1 里判断上一个原生命令成没成功要看 $LASTEXITCODE——
      # `if (pnpm install)` 那种写法在这里是错的（它判的是有没有输出，不是退出码）。
      - name: Install dependencies (pnpm install, retry x3)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          for ($i = 1; $i -le 3; $i++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "pnpm install failed (attempt $i/3), retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          Write-Host 'pnpm install failed after 3 attempts'
          exit 1

      - name: Build native module (napi-rs)
        id: build_native
        continue-on-error: true
        run: pnpm build:native

      - name: Build Electron app
        id: build_app
        continue-on-error: true
        run: pnpm build

      # ── 事实采集②：真实冷启动耗时（本 job 最有价值的一项） ──────────────
      # 跑的是真实构建产物，用的是现成埋点。5 轮取中位数：单轮受实时扫描/缓存
      # 影响很大，一个数字说明不了问题。
      - name: 冷启动时间线（pnpm measure:startup）
        id: startup
        continue-on-error: true
        env:
          HT_STARTUP_RUNS: 5
        # bash 的 `2>&1 | tee` 在 PowerShell 5.1 里没有能照抄的等价物，三处都是坑：
        # 1. 5.1 下原生命令的 stderr 经 `2>&1` 会变成 ErrorRecord 对象进管道，
        #    直接写文件会带上一堆 NativeCommandError 噪声——先 `"$_"` 转成字符串。
        # 2. `Tee-Object -Encoding` 是 PowerShell 6+ 才有的参数，5.1 上直接报错；
        #    而 5.1 的 Tee-Object 默认写 **UTF-16LE**，下面拼摘要时会变乱码。
        # 3. `Out-File -Encoding utf8` 在 5.1 上写的是**带 BOM** 的 UTF-8，BOM 会
        #    以一个看不见的怪字符出现在摘要页第一行。
        # 所以：先收集成字符串数组，回显一份给 job 日志，再用 .NET 直接写无 BOM UTF-8。
        run: |
          $ErrorActionPreference = 'Continue'
          $log = pnpm measure:startup 2>&1 | ForEach-Object { "$_" }
          $log | Write-Host
          [System.IO.File]::WriteAllLines(
            (Join-Path (Get-Location).Path 'startup-timeline.md'),
            [string[]]$log,
            (New-Object System.Text.UTF8Encoding($false))
          )

      # ── 事实采集③：Electron 到底能不能在这个环境下真的起来 ──────────────
      # 直接跑现有的端到端冒烟。它比任何环境查询都有说服力：能跑通就说明
      # Playwright 经 CDP 驱动 Electron 这条路不受 Session 0 影响（页面输入走
      # Input.dispatchKeyEvent，不需要可见桌面）。
      - name: E2E smoke（现有冒烟测试，判断 Electron 能否真的启动）
        id: smoke
        continue-on-error: true
        run: pnpm test:e2e

      # ── 汇总成人能一眼看懂的表格 ──────────────────────────────────────
      # if: always()：上面任何一步挂了都要出报告，而且"挂了"本身就是结论。
      #
      # ── 【中文文案为什么不在这个脚本里】────────────────────────────────
      # 摘要页必须是中文（人要看），而脚本必须是纯 ASCII（5.1 按 GBK 读脚本文件，
      # 见 job 顶部第 5 条）。两个要求只能靠"把中文挪出脚本"来同时满足。
      # 挪到哪里，考虑过两条路：
      #
      #   A. 中文文案放仓库里的 UTF-8 文件，**本步骤显式按 UTF-8 解码**读进来。
      #   B. 本步骤只吐 ASCII 键值对，另起一个 `shell: bash` / node 步骤转成中文。
      #
      # 选 A。理由是**依赖链最短**：
      #   * B 里的 bash 在这台机器上命中的是 WSL 转发器（本 job 存在的头号病因），
      #     只有在上面"修正 PATH"那步**成功**之后才有真 bash——可这一步挂了
      #     `if: always()`，正是要在前面步骤失败时也出报告，而"PATH 修正失败"恰恰
      #     是最需要报告的那种失败。让报告依赖它，等于在最需要日志的时候没日志。
      #   * node 同理：它来自 actions/setup-node，那一步失败时就没有 node。
      #   * A 只依赖 checkout（本 job 的前提），且全程只用一种 shell。
      # 关键点是**显式指定编码**：`[System.IO.File]::ReadAllLines($p, UTF8Encoding)`
      # 与系统区域设置无关，跟 5.1 读 .ps1 时那套"跟着 ANSI 代码页走"的隐式行为
      # 完全是两码事。写出侧继续用 AppendAllText + 无 BOM UTF-8（本来就对）。
      #
      # 文案表：.github/selfhosted-diagnose-summary.zh-CN.md
      #   * labels 分区 = 事实键 → 中文标签
      #   * values 分区 = `@记号@` → 中文短语（脚本里那些 ASCII 记号的还原表）
      #   * body   分区 = 摘要正文，{{FACTS_TABLE}} / {{STARTUP_TIMELINE}} 整块替换，
      #                   {{OUTCOME_*}} 行内替换
      # 模板缺失（checkout 坏了）时退回一份 ASCII 英文摘要——降级也比没有强。
      - name: 写入运行摘要
        if: always()
        # 同上：powershell（5.1），不是 pwsh。见 job 顶部注释。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # ASCII ONLY in this script -- see the job header comment.
          # All Chinese lives in .github/selfhosted-diagnose-summary.zh-CN.md.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $S = $env:GITHUB_STEP_SUMMARY

          # Do NOT use Add-Content: on 5.1 it writes the system ANSI code page
          # (GBK here) while the summary page is parsed as UTF-8, so the whole
          # page would render as mojibake -- silently, with a green step.
          function W($t) { [System.IO.File]::AppendAllText($S, "$t" + [Environment]::NewLine, $utf8NoBom) }

          # Reading side, same idea in reverse: an explicit UTF-8 decoder makes
          # this independent of the machine's locale.
          function Read-Utf8($p) { return [System.IO.File]::ReadAllLines($p, $utf8NoBom) }

          $factLines = @()
          if (Test-Path 'env-facts.tsv') { $factLines = @(Read-Utf8 ((Get-Item 'env-facts.tsv').FullName)) }
          $startupLines = @()
          if (Test-Path 'startup-timeline.md') { $startupLines = @(Read-Utf8 ((Get-Item 'startup-timeline.md').FullName)) }

          $tpl = Join-Path $env:GITHUB_WORKSPACE '.github\selfhosted-diagnose-summary.zh-CN.md'
          if (-not (Test-Path $tpl)) {
            W '## self-hosted runner diagnosis'
            W ''
            W ('Chinese template not found at ' + $tpl + ' -- falling back to a raw ASCII dump.')
            W ''
            W '```'
            foreach ($l in $factLines) { W $l }
            foreach ($l in $startupLines) { W $l }
            W '```'
            exit 0
          }

          # --- parse the template: labels / values / body -------------------
          $labels = @{}
          $values = @{}
          $valueKeys = New-Object System.Collections.Generic.List[string]
          $body = New-Object System.Collections.Generic.List[string]
          $section = ''
          foreach ($line in (Read-Utf8 $tpl)) {
            if ($line -eq '=== labels ===') { $section = 'labels'; continue }
            if ($line -eq '=== values ===') { $section = 'values'; continue }
            if ($line -eq '=== body ===') { $section = 'body'; continue }
            if ($section -eq 'body') { $body.Add($line); continue }
            if ($section -eq '') { continue }
            if ($line.Trim().Length -eq 0) { continue }
            $kv = $line -split "`t", 2
            if ($kv.Count -ne 2) { continue }
            if ($section -eq 'labels') { $labels[$kv[0]] = $kv[1] }
            else { $values[$kv[0]] = $kv[1]; $valueKeys.Add($kv[0]) }
          }

          function Localize($text) {
            $t = "$text"
            foreach ($k in $valueKeys) { $t = $t.Replace($k, $values[$k]) }
            return $t
          }
          function Fallback($key, $ascii) {
            if ($values.ContainsKey($key)) { return $values[$key] }
            return $ascii
          }

          # --- facts table --------------------------------------------------
          $rows = New-Object System.Collections.Generic.List[string]
          foreach ($line in $factLines) {
            if ($line.Trim().Length -eq 0) { continue }
            $kv = $line -split "`t", 2
            if ($kv.Count -ne 2) { continue }
            $label = $kv[0]
            if ($labels.ContainsKey($kv[0])) { $label = $labels[$kv[0]] }
            # A bare '|' in a value would silently split the Markdown cell --
            # and `where.exe` output is joined with ' | '.
            $val = (Localize $kv[1]).Replace('|', '\|')
            $rows.Add('| ' + $label + ' `' + $kv[0] + '` | ' + $val + ' |')
          }
          if ($rows.Count -eq 0) { $rows.Add('| - | ' + (Fallback '@facts-missing@' 'env-facts.tsv was not produced') + ' |') }

          # --- startup timeline block ---------------------------------------
          $startup = New-Object System.Collections.Generic.List[string]
          foreach ($l in $startupLines) { $startup.Add($l) }
          if ($startup.Count -eq 0) { $startup.Add('> ' + (Fallback '@startup-missing@' 'startup-timeline.md was not produced')) }

          # --- render -------------------------------------------------------
          $blocks = @{}
          $blocks['{{FACTS_TABLE}}'] = $rows
          $blocks['{{STARTUP_TIMELINE}}'] = $startup
          $inline = @{}
          $inline['{{OUTCOME_BUILD_NATIVE}}'] = '${{ steps.build_native.outcome }}'
          $inline['{{OUTCOME_BUILD_APP}}'] = '${{ steps.build_app.outcome }}'
          $inline['{{OUTCOME_STARTUP}}'] = '${{ steps.startup.outcome }}'
          $inline['{{OUTCOME_SMOKE}}'] = '${{ steps.smoke.outcome }}'

          foreach ($line in $body) {
            $key = $line.Trim()
            if ($blocks.ContainsKey($key)) {
              foreach ($b in $blocks[$key]) { W $b }
              continue
            }
            $rendered = $line
            foreach ($k in @($inline.Keys)) { $rendered = $rendered.Replace($k, $inline[$k]) }
            W $rendered
          }

          exit 0

      - name: 上传原始诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhosted-diagnostics
          path: |
            env-facts.tsv
            startup-timeline.md
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────
  # verify：把一部分手工 Windows 验证自动化。
  #
  # 重要：这个 job 大概率会红，这是预期的、也是有价值的——
  # crates/ht-core/tests/session.rs 里的测试用 `yes` 这个命令刷屏，
  # Windows 上默认 shell 是 powershell.exe，没有 `yes` 这个命令，
  # 用来暴露哪些测试假设了类 Unix 环境、还不能直接在 Windows 上跑。
  # 不要为了让这个 job 变绿去改测试——用 continue-on-error 让它跑完、
  # 把完整输出留下来，供人工判断哪些测试要改，而不是拿测试结果本身当红绿灯。
  # 因此不设 needs: build，两个 job 并行，verify 红不影响 build 产出 exe。
  # ────────────────────────────────────────────────────────────────
  verify:
    name: verify (windows, non-blocking)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 同 build job：版本只从 package.json 的 packageManager 读，不在这里重复指定。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (pnpm install, retry x3)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "pnpm install failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          echo "pnpm install failed after 3 attempts"
          exit 1

      # 预期会有失败（`yes` 在 Windows 上不存在等）。continue-on-error 让
      # job 整体不因此变红阻塞任何人，但完整 stdout/stderr 仍会留在日志里。
      - name: cargo test -p ht-core (Windows portability probe)
        id: cargo_test
        continue-on-error: true
        run: cargo test -p ht-core -- --nocapture

      # client.test.ts 用 vitest 写；仓库里另有一份 crates/ht-node/__test__/
      # roundtrip.test.mjs 是 node:test 风格，两者不能用同一次 `vitest run`
      # 扫描（会整体退出非 0），所以 package.json 的 test script 显式把
      # 范围限定在 src 下（vitest run src），不触碰 crates/。
      - name: TS-side tests (vitest)
        id: ts_test
        continue-on-error: true
        run: pnpm test

      - name: Summarize verify outcome
        if: always()
        shell: bash
        run: |
          echo "### Windows 验证结果（非阻塞，仅供参考）" >> "$GITHUB_STEP_SUMMARY"
          echo "- cargo test -p ht-core: ${{ steps.cargo_test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- vitest (src): ${{ steps.ts_test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "这个 job 不阻塞 build job 产出 exe。红色是预期结果，用来暴露哪些测试还不能直接在 Windows 上跑（例如依赖 \`yes\` 命令、依赖 \`SHELL\` 环境变量），不代表 CI 配置本身有问题。" >> "$GITHUB_STEP_SUMMARY"
